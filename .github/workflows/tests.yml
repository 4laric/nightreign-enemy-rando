name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Chunked runner: one pytest subprocess per test file. Works around
      # intermittent "Windows fatal exception: access violation" crashes
      # seen in full single-process runs (environmental, not a project bug).
      # test_gui_smoke.py self-skips (no Xvfb/DISPLAY); all other GUI-adjacent
      # tests are skipif-gated or tkinter-free.
      - name: Run test suite (chunked)
        run: python scripts/run_tests.py
