[pytest]
# Engine tests live under tests/. healthbar_inplace has its own unittest
# suite at healthbar_inplace/tests/ — pytest discovers those too via the
# `tests` directory entry below, but they're self-contained.
testpaths = tests healthbar_inplace/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Quiet by default; opt in to verbose with `pytest -v`.
addopts = -ra
